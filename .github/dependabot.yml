# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # Gradle dependencies, plugins & Gradle wrapper
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"
      - "java"
    assignees:
      - "hendisantika"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    rebase-strategy: "auto"
    ignore:
      # 12.x is listed in maven-metadata.xml but its POM/JAR are not published (404) on Maven Central,
      # so skip major bumps of the Conductor client (upgrade it manually after verifying the artifact exists)
      - dependency-name: "io.orkes.conductor:orkes-conductor-client"
        update-types: [ "version-update:semver-major" ]
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot*"
          - "io.spring.dependency-management"
        update-types:
          - "minor"
          - "patch"
      test-dependencies:
        patterns:
          - "org.junit*"
          - "org.springframework.boot:spring-boot-starter-test"
        update-types:
          - "minor"
          - "patch"
      build-plugins:
        patterns:
          - "io.freefair.lombok"
          - "gradle-wrapper"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    target-branch: "main"
    labels:
      - "dependencies"
      - "github_actions"
    assignees:
      - "hendisantika"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
